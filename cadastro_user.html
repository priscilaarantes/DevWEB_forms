<!DOCTYPE html>
<html lang="en">
<head>

<body align="center" bgcolor="#eacea9">

    <table border="1" align="center">

            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Nome Completo:</font></strong>

        </tr>

        <tr>
            <td><br><br></td>
        </tr>

        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">CEP:</font></strong>
                        <input type = "text"></h4>
                </label>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Rua:</font></strong>
                    <input type = "text"></h4>
                </label>
            </td>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Número:</font></strong>

                </label>
        </tr>
<tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Bairro:</font></strong>
                    <input type = "text"></h4>
                </label>
            </td>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Cidade:</font></strong>

                </label>
        </tr>

        <tr>
            <td><br><br></td>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">E-mail:</font></strong>
                        <input type = "email"></h4>
                </label>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Login:</font></strong>
                    <input type = "text"></h4>
                </label>
            </td>
        </tr>
        <tr>
            <td><br><br></td>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Senha:</font></strong>

                </label>
        </tr>
        <tr>
            <td align ="center">
                <label>
                    <h4><strong><font color="#341510">Confirmação de Senha:</font></strong>
                        <input type = "password"></h4>
                </label>
        </tr>
               
</table>

    </a>
